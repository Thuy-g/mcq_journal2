############################################################################
# pytest.ini — repository-root test discovery for MCQ Journal 2.
#
# WHY THIS FILE EXISTS
#   `python -m pytest -q tests/` always worked, but a bare `python -m pytest -q`
#   from the repository root failed at COLLECTION:
#
#     ERROR tests/test_category_extractor_v3.py
#     import file mismatch  (basename collides with
#     outputs/checkpoints/category_selector_v3_before_final_core_patch/
#     test_category_extractor_v3.py)
#
#   `outputs/checkpoints/` holds an ARCHIVED snapshot of a test file whose
#   basename matches a live test. Neither file has an `__init__.py`, so pytest's
#   rootdir-relative module naming maps both to the module name
#   `test_category_extractor_v3` and refuses the second one.
#
#   The archived snapshot is evidence attached to an earlier audit, so it is
#   neither renamed nor deleted. Instead, discovery is told where real tests live
#   and which trees are archives.
#
# WHAT IS DEFINED HERE
#   testpaths     the only tree a bare `pytest` invocation collects.
#   norecursedirs archive/scratch trees never walked, even when a path is given
#                 explicitly on the command line.
#   markers       registers `integration`, which CLAUDE.md requires for every
#                 test that touches an explicitly enabled external service.
#                 Registering it turns PytestUnknownMarkWarning into silence and
#                 makes `-m "not integration"` a supported selection.
#
# NOT DEFINED HERE (deliberately)
#   No addopts, no coverage flags, no `-p no:cacheprovider`. This file fixes
#   discovery and nothing else; changing default flags would silently alter how
#   every earlier recorded test run should be interpreted.
############################################################################

[pytest]
testpaths = tests
norecursedirs = outputs legacy notebooks
markers =
    integration: tests requiring an explicitly enabled external service
